<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vitrine · Achados GTA 6</title>
<meta name="description" content="Os achados que aparecem nos vídeos: setup, luminárias e coisas de GTA 6.">
<meta property="og:title" content="Vitrine · Achados GTA 6">
<meta property="og:description" content="Os achados que aparecem nos vídeos.">
<meta name="theme-color" content="#0A0A10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@1&family=Inter:wght@500;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0A10; --stage: #12111B; --card: #15141F; --line: rgba(139,124,255,.22);
    --vi: #8B7CFF; --pink: #FF5FB8; --txt: #F2F1F7; --dim: rgba(242,241,247,.62); --ink: #0A0A10;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--txt); font-family: Inter, system-ui, sans-serif; min-height: 100vh;
    background-image:
      radial-gradient(ellipse 80% 45% at 50% -5%, rgba(139,124,255,.28), transparent 70%),
      radial-gradient(ellipse 60% 40% at 100% 30%, rgba(255,95,184,.10), transparent 70%),
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: auto, auto, 48px 48px, 48px 48px;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 28px 16px 64px; }
  header { text-align: center; padding: 18px 0 26px; }
  .selo { display: inline-flex; align-items: center; gap: 10px; background: var(--vi); color: var(--ink);
    font: 800 14px Inter; letter-spacing: .04em; padding: 7px 14px; border-radius: 99px; }
  .selo i { width: 4px; height: 16px; background: var(--ink); border-radius: 2px; animation: pisca 1s steps(2) infinite; }
  @keyframes pisca { 50% { opacity: 0; } }
  h1 { font: 400 clamp(46px, 13vw, 88px)/.95 Anton, Impact, sans-serif; letter-spacing: .01em; margin-top: 16px; text-transform: uppercase; }
  h1 span { color: var(--pink); text-shadow: 0 0 28px rgba(255,95,184,.45); }
  .linha { font: italic 400 clamp(22px, 5.5vw, 30px) 'Instrument Serif', Georgia, serif; color: var(--dim); margin-top: 6px; }
  .cats { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    margin: 0 -16px 8px; padding: 12px 16px; background: rgba(10,10,16,.82); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(139,124,255,.14); }
  .cats::-webkit-scrollbar { display: none; }
  .cats[hidden] { display: none; }
  .cat { flex: none; font: 700 13px 'JetBrains Mono', monospace; color: var(--txt); text-decoration: none; background: rgba(255,255,255,.05);
    border: 1.5px solid var(--line); padding: 9px 14px; border-radius: 99px; transition: .2s; }
  .cat.on { background: var(--vi); color: var(--ink); border-color: var(--vi); }
  section { padding-top: 22px; scroll-margin-top: 64px; }
  .sec { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .sec h2 { font: 400 clamp(28px, 8vw, 40px)/1 Anton, Impact, sans-serif; text-transform: uppercase; letter-spacing: .01em; }
  .sec .n { font: 700 12px 'JetBrains Mono', monospace; color: var(--ink); background: var(--pink); padding: 4px 9px; border-radius: 99px; }
  .sec::after { content: ''; flex: 1; height: 2px; background: linear-gradient(90deg, rgba(139,124,255,.6), transparent); }
  .grade { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .card { position: relative; display: flex; flex-direction: column; background: var(--card); border: 1.5px solid var(--line);
    border-radius: 18px; overflow: hidden; text-decoration: none; color: inherit; transition: transform .2s, border-color .2s, box-shadow .2s; }
  .card:hover, .card:focus-visible { transform: translateY(-3px); border-color: var(--vi); box-shadow: 0 10px 40px rgba(139,124,255,.25); outline: none; }
  .foto { position: relative; aspect-ratio: 1 / 1; background: #0d0c14; overflow: hidden; }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s; }
  .card:hover .foto img { transform: scale(1.04); }
  .tag { position: absolute; z-index: 1; top: 8px; left: 8px; font: 800 10px Inter; letter-spacing: .05em;
    padding: 5px 8px; border-radius: 99px; background: var(--pink); color: var(--txt); }
  .corpo { padding: 10px 11px 11px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
  .loja { font: 700 10px 'JetBrains Mono', monospace; color: var(--dim); letter-spacing: .04em; }
  .nome { font: 800 14.5px/1.25 Inter; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .video { font: italic 400 15px/1.15 'Instrument Serif', Georgia, serif; color: var(--vi); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .info { display: none; font: 500 14px/1.4 Inter; color: var(--dim); -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rodape { margin-top: auto; padding-top: 6px; display: flex; flex-direction: column; gap: 8px; }
  .preco { font: 400 22px/1 Anton, Impact, sans-serif; color: var(--pink); white-space: nowrap; }
  .btn { text-align: center; font: 800 13px Inter; background: var(--vi); color: var(--ink); padding: 9px 10px; border-radius: 99px; white-space: nowrap; }
  .btn .l { display: none; }
  @media (min-width: 720px) {
    .grade { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .card { border-radius: 22px; }
    .tag { top: 12px; left: 12px; font-size: 12px; padding: 6px 11px; }
    .corpo { padding: 16px 18px 18px; gap: 8px; }
    .loja { font-size: 12px; }
    .nome { font-size: 18px; }
    .video { font-size: 18px; -webkit-line-clamp: 1; }
    .info { display: -webkit-box; }
    .preco { font-size: 28px; }
    .btn { font-size: 14px; padding: 11px 16px; }
    .btn .l { display: inline; }
  }
  @media (min-width: 1000px) { .grade { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .vazio { text-align: center; color: var(--dim); padding: 40px 0; font: 500 16px Inter; }
  footer { text-align: center; margin-top: 36px; font: 600 12px/1.6 'JetBrains Mono', monospace; color: rgba(242,241,247,.45); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="selo"><span id="selo">GTA 6 · ACHADOS</span><i></i></span>
    <h1 id="titulo">A <span>vitrine</span></h1>
    <p class="linha" id="linha">os achados que aparecem nos vídeos</p>
  </header>
  <nav class="cats" id="cats" aria-label="Categorias"></nav>
  <main id="secoes"></main>
  <p class="vazio" id="vazio" hidden>Nenhum achado ainda.</p>
  <footer id="aviso">#publi · links de afiliado: ao comprar por eles eu posso ganhar uma comissão, sem custo extra pra você.</footer>
</div>
<script src="produtos.js"></script>
<script>
  const CFG = window.VITRINE || {}, P = (window.PRODUTOS || []).filter(p => p.ativo !== false);
  if (CFG.selo) document.getElementById('selo').textContent = CFG.selo;
  if (CFG.titulo) document.getElementById('titulo').innerHTML = CFG.titulo;
  if (CFG.linha) document.getElementById('linha').textContent = CFG.linha;
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-');
  const ordem = CFG.categorias || [];
  const grupos = {};
  P.forEach(p => (grupos[p.categoria || 'Outros'] ||= []).push(p));
  const cats = Object.keys(grupos).sort((a, b) => ((ordem.indexOf(a) + 1) || 99) - ((ordem.indexOf(b) + 1) || 99));
  const card = p => `
      <a class="card" href="${esc(p.link)}" target="_blank" rel="noopener sponsored nofollow">
        <div class="foto">
          ${p.etiqueta ? `<span class="tag">${esc(p.etiqueta)}</span>` : ''}
          <img src="${esc(p.imagem)}" alt="${esc(p.nome)}" loading="lazy">
        </div>
        <div class="corpo">
          ${p.loja ? `<div class="loja">${esc(p.loja)}</div>` : ''}
          <div class="nome">${esc(p.nome)}</div>
          ${p.video ? `<div class="video">do vídeo: ${esc(p.video)}</div>` : ''}
          ${p.info ? `<div class="info">${esc(p.info)}</div>` : ''}
          <div class="rodape">
            ${p.preco ? `<span class="preco">${esc(p.preco)}</span>` : ''}
            <span class="btn">VER<span class="l"> NA LOJA</span> →</span>
          </div>
        </div>
      </a>`;
  document.getElementById('vazio').hidden = P.length > 0;
  document.getElementById('secoes').innerHTML = cats.map(c => {
    const l = grupos[c].sort((a, b) => (b.destaque ? 1 : 0) - (a.destaque ? 1 : 0));
    return `<section id="${slug(c)}"><div class="sec"><h2>${esc(c)}</h2><span class="n">${l.length}</span></div><div class="grade">${l.map(card).join('')}</div></section>`;
  }).join('');
  const nav = document.getElementById('cats');
  nav.hidden = cats.length < 2;
  nav.innerHTML = cats.map((c, i) => `<a class="cat${i ? '' : ' on'}" href="#${slug(c)}">${esc(c)}</a>`).join('');
  // destaca a categoria que está na tela
  try {
    const links = [...nav.children];
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + e.target.id)); }), { rootMargin: '-30% 0px -60% 0px' });
    document.querySelectorAll('section').forEach(s => io.observe(s));
  } catch (e) {}
</script>
</body>
</html>
